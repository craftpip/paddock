services:
  webui:
    build:
      context: ./src
    image: paddock-webui:latest
    container_name: paddock
    restart: unless-stopped
    ports:
      - "6789:6789"
      - "5173:5173"
    volumes:
      - .:/workspace:rw
      - ./src:/app:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
