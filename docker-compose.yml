services:
  vm-webui:
    build:
      context: ./src
    image: vm-friends-vm-webui:latest
    container_name: vm-webui
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - /home/boniface/www/vm-friends:/workspace:rw
      - /home/boniface/www/vm-friends/src:/app:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Kolkata
      AUTH_PASSWORD: "${WEBUI_PASSWORD:-}"

  vm-ozden:
    build:
      context: ./vm_openclaw
    image: vm-friends-vm-openclaw:latest
    container_name: vm-ozden
    restart: unless-stopped
    volumes:
      - ./instances/vm-ozden/openclaw:/root/.openclaw
      - /tmp/screenshots:/tmp/screenshots
    environment:
      TZ: Asia/Kolkata
      ROOT_PASSWORD: ozden

