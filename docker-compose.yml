services:
  webui:
    build:
      context: ./src
    image: paddock-webui:latest
    container_name: paddock
    restart: unless-stopped
    # Runs as root (plan 43) so the webui has root control over the host FS
    # and Docker; PUID/PGID are the chown targets for user files (ownership.js).
    ports:
      - "6789:6789"
      - "5173:5173"
    volumes:
      - .:/workspace:rw
      - ./src:/app:rw
      - /www2:/www2:ro
      - /www1:/www1
      # Plan 92: read-write on purpose — lifecycle callback scripts run inside
      # this container and the human requires docker control from them
      # (container restart, network/IP changes). A rw socket is effectively
      # host root; recorded here deliberately, not slipped in silently.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    env_file:
      - .env
    environment:
      HOME: /home
