services:
  ${CONTAINER_PREFIX}-webui:
    build:
      context: ./src
    image: paddock-webui:latest
    container_name: ${CONTAINER_PREFIX}-webui
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - /mnt/ddrive/www/vm-friends:/workspace:rw
      - /mnt/ddrive/www/vm-friends/src:/app:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Kolkata
      CONTAINER_PREFIX: "${CONTAINER_PREFIX:-vm}"
      AUTH_PASSWORD: "${WEBUI_PASSWORD:-}"
