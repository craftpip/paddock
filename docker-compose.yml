services:
  webui:
    build:
      context: ./src
    image: paddock-webui:latest
    container_name: paddock
    restart: unless-stopped
    # Runs as root (plan 43) so the webui has root control over the host FS
    # and Docker; PUID/PGID are the chown targets for user files (ownership.js).
    ports:
      - "6789:6789"
      - "5173:5173"
    volumes:
      - .:/workspace:rw
      - ./src:/app:rw
      - /www2:/www2:ro
      - /www1:/www1
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      HOME: /home
