services:
  webui:
    build:
      context: ./src
    image: paddock-webui:latest
    container_name: paddock-webui
    restart: unless-stopped
    ports:
      - "5051:5050"
      - "5173:5173"
    volumes:
      - .:/workspace:rw
      - ./src:/app:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Kolkata
      CONTAINER_PREFIX: "${CONTAINER_PREFIX:-vm}"
      HOST_WORKSPACE_ROOT: "${HOST_WORKSPACE_ROOT:-}"
      AUTH_PASSWORD: "${WEBUI_PASSWORD:-}"
      AUTO_LOGIN: "${AUTO_LOGIN:-false}"
