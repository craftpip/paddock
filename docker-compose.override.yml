services:
  vm-jake2:
    build:
      context: ./vm_openclaw
    image: vm-friends-vm-openclaw:latest
    container_name: vm-jake2
    restart: unless-stopped

    volumes:
      - ./instances/vm-jake2/openclaw:/root/.openclaw
    environment:
      TZ: Asia/Kolkata
      ROOT_PASSWORD: jake2
  vm-jake:
    build:
      context: ./vm_openclaw
    image: vm-friends-vm-openclaw:latest
    container_name: vm-jake
    restart: unless-stopped

    volumes:
      - ./instances/vm-jake/openclaw:/root/.openclaw
    environment:
      TZ: Asia/Kolkata
      ROOT_PASSWORD: jake
  vm-ozden2:
    build:
      context: ./vm_openclaw
    image: vm-friends-vm-openclaw:latest
    container_name: vm-ozden2
    restart: unless-stopped
    ports:
      - "43820:22"
    volumes:
      - ./instances/vm-ozden2/openclaw:/root/.openclaw
    environment:
      TZ: Asia/Kolkata
      ROOT_PASSWORD: ozden2
