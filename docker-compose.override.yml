services:
  vm-jake:
    build:
      context: ./vm_openclaw
    image: vm-friends-vm-openclaw:latest
    container_name: vm-jake
    restart: unless-stopped
    volumes:
      - ./instances/vm-jake/openclaw:/root/.openclaw
    environment:
      TZ: Asia/Kolkata
      ROOT_PASSWORD: 
