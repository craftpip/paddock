# Deploy the VitePress website (docs/) to GitHub Pages.
# Site source is docs/, output is docs/.vitepress/dist.
# Live URL: https://<owner>.github.io/<repo>/
name: Deploy website to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs deps
        working-directory: docs
        run: npm ci
      - name: Build VitePress site
        working-directory: docs
        # Host the site at the repo root: https://<owner>.github.io/<repo>/
        run: |
          export DOCS_BASE="/${{ github.event.repository.name }}/"
          npm run docs:build
          touch .vitepress/dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
